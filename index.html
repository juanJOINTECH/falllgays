<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bean Rush - Carrera de obstáculos</title>
<style>
  :root { --ink:#2b1a5e; --pink:#ff5fa2; --sun:#ffd23f; --mint:#3ddc97; }
  * { box-sizing:border-box; margin:0; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; background:#1c1042; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; margin:auto; top:50%; transform:translateY(-50%); }
  canvas { width:100%; height:100%; display:block; border-radius:14px; background:#8fd3ff; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(43,26,94,.78); color:#fff; text-align:center; border-radius:14px; padding:16px; }
  .overlay.hidden { display:none; }
  h1 { font-size:clamp(34px,7vw,76px); font-weight:900; color:var(--sun); letter-spacing:1px; line-height:1;
    text-shadow:0 5px 0 var(--pink), 0 10px 0 rgba(0,0,0,.25); transform:rotate(-3deg); }
  p { font-size:clamp(13px,1.8vw,19px); max-width:560px; line-height:1.4; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .sw { width:38px; height:38px; border-radius:50%; border:4px solid #fff; cursor:pointer; transition:transform .12s; }
  .sw.on { transform:scale(1.25); border-color:var(--sun); box-shadow:0 0 0 3px var(--ink); }
  button.big { font:inherit; font-weight:900; font-size:clamp(18px,3vw,30px); padding:12px 38px; border:0; border-radius:40px;
    background:var(--mint); color:var(--ink); cursor:pointer; box-shadow:0 7px 0 #1f9e6b; }
  button.big:active { transform:translateY(5px); box-shadow:0 2px 0 #1f9e6b; }
  #place { font-size:clamp(40px,10vw,110px); font-weight:900; color:var(--sun); text-shadow:0 5px 0 var(--pink); }
  #touch { position:absolute; left:0; right:0; bottom:10px; display:none; justify-content:space-between; padding:0 16px; pointer-events:none; }
  #touch div { display:flex; gap:12px; pointer-events:auto; }
  #touch button { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:rgba(255,95,162,.8); color:#fff; font-size:30px; font-weight:900; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
 
  <div id="menu" class="overlay">
    <h1>BEAN RUSH</h1>
    <p>Corre contra 7 frijoles, salta los huecos y esquiva martillos y barras giratorias. ¡El primero en la meta gana la corona!</p>
    <p>Elige tu color:</p>
    <div class="swatches" id="swatches"></div>
    <button class="big" id="play">¡Jugar!</button>
    <p>← → o A D para correr · Espacio, W o ↑ para saltar</p>
  </div>
 
  <div id="result" class="overlay hidden">
    <div id="place"></div>
    <p id="msg"></p>
    <button class="big" id="again">Jugar otra vez</button>
  </div>
 
  <div id="touch">
    <div><button id="bL">◀</button><button id="bR">▶</button></div>
    <div><button id="bJ">▲</button></div>
  </div>
</div>
 
<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GY = 430, FIN = 7000, G = 1900, MAXV = 330;
const COLORS = ['#ff5fa2','#ffd23f','#3ddc97','#4cc9f0','#ff8a3d','#a66cff','#ff4d4d','#ffffff'];
let myColor = COLORS[0], state = 'menu', t = 0, countdown = 3, raceTime = 0, shake = 0;
 
// ---------- Pista ----------
const gaps = [[900,150],[1950,170],[3150,190],[4600,200],[5700,170],[6300,150]];
const boxes = [{x:1550,w:46,h:54},{x:2750,w:46,h:54},{x:3850,w:46,h:54},{x:5300,w:46,h:54}];
const hammers = [{x:1350,ph:0,sp:2.1},{x:2450,ph:1.5,sp:2.4},{x:3650,ph:3,sp:2.2},{x:5050,ph:0.7,sp:2.6},{x:6050,ph:2,sp:2.8}];
const spinners = [{x:2250,sp:2.3},{x:4100,sp:-2.6},{x:5450,sp:2.9}];
const HP = 120, HL = 270;                 // pivote y y largo del martillo
 
const solidAt = x => !gaps.some(g => x > g[0] && x < g[0] + g[1]);
const hammerHead = h => { const a = Math.sin(t*h.sp + h.ph)*1.15, w = Math.cos(t*h.sp + h.ph)*1.15*h.sp;
  return {x:h.x + Math.sin(a)*HL, y:HP + Math.cos(a)*HL, dir:Math.sign(w)||1}; };
const spinAngle = s => t*s.sp;
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; let u=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy); u=Math.max(0,Math.min(1,u));
  return Math.hypot(px-(ax+u*dx), py-(ay+u*dy)); }
 
// ---------- Frijoles ----------
const NAMES = ['Tú','Bola','Pipo','Nube','Gus','Lulú','Chispa','Moti'];
let beans = [];
function makeBean(i){
  const col = i===0 ? myColor : COLORS.filter(c=>c!==myColor)[(i-1)%7];
  return { i, name:NAMES[i], col, x:80, y:GY-46-i*0.1, w:34, h:46, vx:0, vy:0, ground:false, stun:0, hitCd:0,
    dir:0, wantJump:false, face:1, anim:0, fin:false, finT:0, lastSafe:80, respawn:0, bot:i>0,
    spd: 255 + Math.random()*70, smart: 0.45 + Math.random()*0.5, jitter: Math.random()*0.012 };
}
function reset(){
  beans = []; for (let i=0;i<8;i++){ const b = makeBean(i); b.x = 60; b.y = GY - 46; b.lane = i; beans.push(b); }
  // los frijoles salen separados un poco para no amontonarse
  beans.forEach((b,i)=>{ b.x = 40 + i*18; });
  countdown = 3.99; raceTime = 0; state = 'count';
}
 
function knock(b, dir, power, up){ if (b.hitCd>0) return; b.vx = dir*power; b.vy = -up; b.stun = 0.75; b.hitCd = 1.1; b.ground=false; if (b===beans[0]) shake = 0.3; }
 
function update(b, dt){
  b.hitCd -= dt; b.stun -= dt;
  if (b.respawn > 0){ b.respawn -= dt; if (b.respawn<=0){ b.x=b.lastSafe; b.y=100; b.vx=0; b.vy=0; b.stun=0.3; b.hitCd=1.5; } return; }
  const racing = state==='race' && !b.fin;
  let dir = 0, jump = false;
  if (b.bot) botThink(b); 
  if (racing && b.stun<=0){ dir = b.dir; jump = b.wantJump; }
  if (b.fin) dir = 0;
  const max = b.bot ? b.spd : MAXV;
  const acc = b.ground ? 9 : 3.2;
  if (b.stun<=0) b.vx += (dir*max - b.vx) * Math.min(1, acc*dt);
  else b.vx *= (1 - Math.min(1, 1.6*dt));
  if (dir) b.face = dir;
  if (jump && b.ground && b.stun<=0){ b.vy = -760; b.ground = false; }
  b.vy += G*dt;
  if (b.vy < -200 && !(b.bot ? b.holdJump : keys.jump)) b.vy += G*dt*0.9; // salto variable
  const prevFeet = b.y + b.h;
  b.x += b.vx*dt; b.y += b.vy*dt;
  let feet = b.y + b.h; b.ground = false;
  if (b.vy >= 0 && prevFeet <= GY + 8 && feet >= GY && solidAt(b.x - 8) || (b.vy>=0 && prevFeet <= GY+8 && feet>=GY && solidAt(b.x+8))){
    b.y = GY - b.h; b.vy = 0; b.ground = true; }
  for (const bx of boxes){
    const top = GY - bx.h;
    if (b.x + b.w/2 > bx.x && b.x - b.w/2 < bx.x + bx.w && b.y + b.h > top){
      if (prevFeet <= top + 6 && b.vy >= 0){ b.y = top - b.h; b.vy = 0; b.ground = true; }
      else { b.x = b.x < bx.x + bx.w/2 ? bx.x - b.w/2 : bx.x + bx.w + b.w/2; b.vx = 0; }
    }
  }
  if (b.x < 20) { b.x = 20; b.vx = Math.max(0,b.vx); }
  if (b.ground && b.stun<=0 && solidAt(b.x-30) && solidAt(b.x+30) && !boxes.some(q=>Math.abs(b.x-(q.x+q.w/2))<90)) b.lastSafe = b.x;
  // martillos
  for (const h of hammers){ const p = hammerHead(h); const cx=b.x, cy=b.y+b.h/2;
    if (Math.hypot(cx-p.x, cy-p.y) < 30 + 20) knock(b, p.dir, 560, 430); }
  // barras giratorias
  for (const s of spinners){ const a = spinAngle(s), py = GY-95, R = 105;
    if (segDist(b.x, b.y+b.h/2, s.x-Math.cos(a)*R, py-Math.sin(a)*R, s.x+Math.cos(a)*R, py+Math.sin(a)*R) < 8 + 19)
      knock(b, Math.sign(b.x - s.x)||1, 480, 480); }
  // caída
  if (b.y > H + 80 && b.respawn <= 0){ b.respawn = 0.9; if (b===beans[0]) shake = 0.25; }
  // meta
  if (!b.fin && b.x >= FIN){ b.fin = true; b.finT = raceTime; }
  b.anim += Math.abs(b.vx)*dt*0.05;
}
 
function botThink(b){
  b.dir = 1; b.wantJump = false; b.holdJump = true;
  if (state!=='race' || !b.ground) return;
  const look = 70 + Math.abs(b.vx)*0.2;
  if (!solidAt(b.x + look)) b.wantJump = true;
  for (const bx of boxes) if (bx.x - b.x > 10 && bx.x - b.x < 95) b.wantJump = true;
  for (const h of hammers){ const p = hammerHead(h); const d = h.x - b.x;
    if (d > -40 && d < 230 && Math.hypot(p.x-b.x, p.y-(b.y+b.h/2)) < 190 && b.smart > 0.62) b.dir = -0.2; }
  for (const s of spinners){ const d = s.x - b.x; if (d > 10 && d < 220 && b.smart > 0.55) { const a = spinAngle(s)%Math.PI; if (Math.abs(Math.sin(a))>0.55 || d>150) b.dir = d<150 ? 0 : 0.6; if (d<75) b.wantJump = Math.random()<0.5; } }
  if (Math.random() < b.jitter*0.1) b.wantJump = true;
}
 
function collideBeans(){
  for (let i=0;i<beans.length;i++) for (let j=i+1;j<beans.length;j++){
    const a=beans[i], b=beans[j]; if (a.respawn>0||b.respawn>0) continue;
    const dx=b.x-a.x, dy=b.y-a.y;
    if (Math.abs(dx)<30 && Math.abs(dy)<42){ const push=(30-Math.abs(dx))/2*Math.sign(dx||1); a.x-=push; b.x+=push;
      const m=(a.vx+b.vx)/2; a.vx=m-Math.sign(dx||1)*20; b.vx=m+Math.sign(dx||1)*20; }
  }
}
 
// ---------- Posiciones ----------
function ranking(){
  return beans.slice().sort((p,q)=> (q.fin-p.fin) || (p.fin && q.fin ? p.finT-q.finT : q.x-p.x));
}
 
// ---------- Entrada ----------
const keys = {left:false,right:false,jump:false};
const map = {ArrowLeft:'left',KeyA:'left',ArrowRight:'right',KeyD:'right',ArrowUp:'jump',KeyW:'jump',Space:'jump'};
addEventListener('keydown',e=>{ if(map[e.code]){ keys[map[e.code]]=true; e.preventDefault(); }});
addEventListener('keyup',e=>{ if(map[e.code]) keys[map[e.code]]=false; });
[['bL','left'],['bR','right'],['bJ','jump']].forEach(([id,k])=>{ const el=document.getElementById(id);
  const on=e=>{keys[k]=true;e.preventDefault()}, off=e=>{keys[k]=false;e.preventDefault()};
  el.addEventListener('touchstart',on,{passive:false}); el.addEventListener('touchend',off,{passive:false});
  el.addEventListener('mousedown',on); el.addEventListener('mouseup',off); el.addEventListener('mouseleave',off); });
 
function playerInput(){ const p = beans[0];
  p.dir = (keys.right?1:0) - (keys.left?1:0); p.wantJump = keys.jump; }
 
// ---------- Dibujo ----------
let cam = 0;
function bg(){
  const g = ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,'#6ec6ff'); g.addColorStop(1,'#ffe3f1');
  ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
  // colinas lejanas
  for (let k=0;k<2;k++){ ctx.fillStyle = k?'#b58cff':'#d6b8ff'; const par = k?0.35:0.15;
    for (let i=-1;i<8;i++){ const x = i*260 - (cam*par)%260; ctx.beginPath(); ctx.arc(x+130, GY+40+(k?30:0), 140-k*30, Math.PI, 0); ctx.fill(); } }
  // nubes
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  for (let i=0;i<6;i++){ const x = ((i*330 - cam*0.5) % 1980 + 1980) % 1980 - 200, y = 50 + (i%3)*45;
    ctx.beginPath(); ctx.arc(x,y,26,0,7); ctx.arc(x+30,y-12,32,0,7); ctx.arc(x+66,y,26,0,7); ctx.fill(); }
}
function ground(){
  let x0 = -200; const segs = []; let cur = 0;
  gaps.forEach(g=>{ segs.push([cur,g[0]]); cur = g[0]+g[1]; }); segs.push([cur, FIN+400]);
  segs.forEach(([a,b])=>{
    const sx = a - cam, sw = b - a; if (sx > W || sx + sw < 0) return;
    ctx.fillStyle = '#6a4bd6'; ctx.fillRect(sx, GY, sw, H-GY);
    ctx.fillStyle = '#7d5ff0'; for (let x=Math.max(a,cam-40); x<Math.min(b,cam+W+40); x+=60){ if (((x/60)|0)%2) ctx.fillRect(x-cam, GY+18, 60, H-GY); }
    ctx.fillStyle = '#ff5fa2'; ctx.fillRect(sx, GY, sw, 16);
    ctx.fillStyle = '#ffd23f'; for (let x=Math.max(a,cam-40); x<Math.min(b,cam+W+40); x+=40){ ctx.fillRect(x-cam, GY, 20, 7); }
  });
  // baba verde en los huecos
  ctx.fillStyle = '#3ddc97'; gaps.forEach(g=>{ const sx=g[0]-cam; if (sx>W||sx+g[1]<0) return;
    ctx.beginPath(); ctx.moveTo(sx,H); for (let i=0;i<=g[1];i+=10) ctx.lineTo(sx+i, H-26+Math.sin(t*3+i*0.1)*6); ctx.lineTo(sx+g[1],H); ctx.fill(); });
}
function obstacles(){
  boxes.forEach(b=>{ const sx=b.x-cam; if (sx>W||sx+b.w<0) return; const top=GY-b.h;
    ctx.fillStyle='#ffd23f'; ctx.fillRect(sx,top,b.w,b.h); ctx.fillStyle='#ff8a3d'; ctx.fillRect(sx,top,b.w,10);
    ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=4; ctx.strokeRect(sx,top,b.w,b.h); });
  hammers.forEach(h=>{ const sx=h.x-cam; if (sx>W+300||sx<-300) return; const p=hammerHead(h);
    ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=12; ctx.beginPath(); ctx.moveTo(sx,HP); ctx.lineTo(p.x-cam,p.y); ctx.stroke();
    ctx.strokeStyle='#c8c8e8'; ctx.lineWidth=6; ctx.beginPath(); ctx.moveTo(sx,HP); ctx.lineTo(p.x-cam,p.y); ctx.stroke();
    ctx.fillStyle='#ff4d4d'; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(p.x-cam,p.y,30,0,7); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(p.x-cam-9,p.y-9,8,0,7); ctx.fill();
    ctx.fillStyle='#2b1a5e'; ctx.fillRect(sx-26,HP-14,52,14); });
  spinners.forEach(s=>{ const sx=s.x-cam; if (sx>W+150||sx<-150) return; const a=spinAngle(s), py=GY-95, R=105;
    ctx.fillStyle='#2b1a5e'; ctx.fillRect(sx-8,py,16,GY-py);
    ctx.lineCap='round'; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=22; ctx.beginPath(); ctx.moveTo(sx-Math.cos(a)*R,py-Math.sin(a)*R); ctx.lineTo(sx+Math.cos(a)*R,py+Math.sin(a)*R); ctx.stroke();
    ctx.strokeStyle='#3ddc97'; ctx.lineWidth=14; ctx.stroke();
    ctx.fillStyle='#ffd23f'; ctx.beginPath(); ctx.arc(sx,py,12,0,7); ctx.fill(); ctx.lineCap='butt'; });
  // meta
  const fx=FIN-cam; if (fx>-100&&fx<W+100){
    ctx.fillStyle='#2b1a5e'; ctx.fillRect(fx-14,GY-260,14,260); ctx.fillRect(fx+110,GY-260,14,260);
    for (let i=0;i<9;i++) for (let j=0;j<2;j++){ ctx.fillStyle=(i+j)%2?'#fff':'#2b1a5e'; ctx.fillRect(fx-14+i*15.5,GY-260+j*15.5,15.5,15.5); }
    ctx.fillStyle='#ffd23f'; ctx.font='900 30px Trebuchet MS'; ctx.textAlign='center'; ctx.fillText('META',fx+55,GY-225); }
}
function drawBean(b){
  if (b.respawn>0) return; const sx=b.x-cam; if (sx<-60||sx>W+60) return;
  const top=b.y, f=b.face, sw=b.ground?Math.sin(b.anim)*8:6, stunned=b.stun>0;
  ctx.save(); ctx.translate(sx, top + b.h/2); if (stunned) ctx.rotate(Math.sin(t*30)*0.25);
  ctx.translate(0,-b.h/2);
  ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=4;
  ctx.fillStyle=b.col;  // piernas
  [-1,1].forEach(s=>{ ctx.beginPath(); ctx.roundRect(s*8-6+(s*sw*0.4), b.h-12, 12, 12, 4); ctx.fill(); ctx.stroke(); });
  ctx.beginPath(); ctx.roundRect(-17,0,34,b.h-6,16); ctx.fill(); ctx.stroke();
  ctx.fillStyle='rgba(255,255,255,.35)'; ctx.beginPath(); ctx.roundRect(-11,5,8,16,4); ctx.fill();
  ctx.fillStyle=b.col; ctx.beginPath(); ctx.arc(-f*18, 24+(b.ground?sw*0.3:-6), 6, 0,7); ctx.fill(); ctx.stroke(); // brazo
  ctx.beginPath(); ctx.arc(f*18, 24-(b.ground?sw*0.3:6), 6, 0,7); ctx.fill(); ctx.stroke();
  ctx.fillStyle='#fff'; ctx.beginPath(); ctx.ellipse(f*5,14,8,9,0,0,7); ctx.fill(); ctx.stroke();  // ojo
  ctx.fillStyle='#2b1a5e'; ctx.beginPath(); ctx.arc(f*8,15,3.5,0,7); ctx.fill();
  if (stunned){ ctx.font='900 16px Trebuchet MS'; ctx.textAlign='center'; ctx.fillStyle='#ffd23f'; ctx.fillText('✦ ✦',0,-8); }
  ctx.restore();
  if (b.i===0){ ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=3; ctx.beginPath();
    ctx.moveTo(sx,top-8); ctx.lineTo(sx-10,top-24); ctx.lineTo(sx+10,top-24); ctx.closePath(); ctx.fill(); ctx.stroke(); }
}
function hud(){
  const r = ranking(), pos = r.indexOf(beans[0]) + 1;
  ctx.textAlign='left'; ctx.fillStyle='#fff'; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=6; ctx.lineJoin='round';
  ctx.font='900 46px Trebuchet MS'; const s=pos+'/8'; ctx.strokeText(s,22,56); ctx.fillText(s,22,56);
  ctx.textAlign='right'; ctx.font='900 30px Trebuchet MS'; const ts=raceTime.toFixed(1)+' s'; ctx.strokeText(ts,W-22,50); ctx.fillText(ts,W-22,50);
  // barra de progreso
  const bx=180, bw=W-360, by=H-26; ctx.fillStyle='rgba(43,26,94,.65)'; ctx.beginPath(); ctx.roundRect(bx,by-6,bw,12,6); ctx.fill();
  beans.slice().reverse().forEach(b=>{ const px=bx+Math.min(1,b.x/FIN)*bw; ctx.fillStyle=b.col; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.arc(px,by,b.i===0?10:7,0,7); ctx.fill(); ctx.stroke(); });
  if (state==='count'){ const n=Math.ceil(countdown-0.99); ctx.textAlign='center'; ctx.font='900 160px Trebuchet MS'; ctx.fillStyle='#ffd23f'; ctx.strokeStyle='#ff5fa2'; ctx.lineWidth=14;
    const txt = n>0?String(n):'¡YA!'; ctx.strokeText(txt,W/2,H/2+40); ctx.fillText(txt,W/2,H/2+40); }
  if (state==='race' && raceTime<1.2){ ctx.textAlign='center'; ctx.font='900 110px Trebuchet MS'; ctx.fillStyle='#3ddc97'; ctx.strokeStyle='#2b1a5e'; ctx.lineWidth=12;
    ctx.strokeText('¡YA!',W/2,H/2+30); ctx.fillText('¡YA!',W/2,H/2+30); }
}
 
// ---------- Bucle ----------
let last = performance.now(), doneTimer = 0;
function frame(now){
  const dt = Math.min(0.033, (now-last)/1000); last = now; t += dt;
  if (state==='count'){ countdown -= dt; if (countdown<=0.99){ state='race'; } }
  if (state==='race' || state==='done'){ raceTime += (state==='race' && !beans[0].fin) ? dt : 0; }
  if (beans.length){
    playerInput(); beans.forEach(b=>update(b,dt)); collideBeans();
    if (state==='race' && beans[0].fin){ state='done'; doneTimer=1.4; }
    if (state==='done'){ doneTimer-=dt; if (doneTimer<=0){ showResult(); state='over'; } }
    const target = Math.max(0, Math.min(FIN-W+260, beans[0].x - 330)); cam += (target-cam)*Math.min(1,dt*7);
  }
  shake = Math.max(0, shake-dt);
  ctx.save(); if (shake>0) ctx.translate((Math.random()-.5)*8,(Math.random()-.5)*8);
  bg(); ground(); obstacles(); beans.slice().reverse().forEach(drawBean); hud(); ctx.restore();
  requestAnimationFrame(frame);
}
 
// ---------- Menús ----------
const sw = document.getElementById('swatches');
COLORS.forEach(c=>{ const d=document.createElement('div'); d.className='sw'+(c===myColor?' on':''); d.style.background=c;
  d.onclick=()=>{ myColor=c; [...sw.children].forEach(x=>x.classList.remove('on')); d.classList.add('on'); }; sw.appendChild(d); });
document.getElementById('play').onclick = ()=>{ document.getElementById('menu').classList.add('hidden'); cam=0; reset(); };
document.getElementById('again').onclick = ()=>{ document.getElementById('result').classList.add('hidden'); cam=0; reset(); };
function showResult(){
  const r = ranking(), pos = r.indexOf(beans[0])+1;
  document.getElementById('place').textContent = pos===1 ? '👑 ¡1.º!' : pos+'.º lugar';
  document.getElementById('msg').textContent = pos===1 ? '¡Campeón! Cruzaste la meta en '+beans[0].finT.toFixed(1)+' segundos.'
    : pos<=3 ? '¡Podio! Tiempo: '+beans[0].finT.toFixed(1)+' s. Un salto mejor y la corona es tuya.' : 'Tiempo: '+beans[0].finT.toFixed(1)+' s. Cuidado con los martillos, ¡inténtalo otra vez!';
  document.getElementById('result').classList.remove('hidden');
}
reset(); state='menu'; requestAnimationFrame(frame);
</script>
</body>
</html>
