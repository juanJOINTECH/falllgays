<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Bean Rush - Carrera de obstáculos</title>
<style>
  :root { --ink:#2b1a5e; --pink:#ff5fa2; --sun:#ffd23f; --mint:#3ddc97; }
  * { box-sizing:border-box; margin:0; touch-action:manipulation; -webkit-user-select:none; user-select:none; }
  html,body { height:100%; background:#1c1042; font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif; overflow:hidden; }
  #wrap { position:relative; width:min(100vw, calc(100vh * 16 / 9)); aspect-ratio:16/9; margin:auto; top:50%; transform:translateY(-50%); }
  canvas { width:100%; height:100%; display:block; border-radius:14px; background:#8fd3ff; }
  .overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:rgba(43,26,94,.78); color:#fff; text-align:center; border-radius:14px; padding:16px; }
  .overlay.hidden { display:none; }
  h1 { font-size:clamp(34px,7vw,76px); font-weight:900; color:var(--sun); letter-spacing:1px; line-height:1;
    text-shadow:0 5px 0 var(--pink), 0 10px 0 rgba(0,0,0,.25); transform:rotate(-3deg); }
  p { font-size:clamp(13px,1.8vw,19px); max-width:560px; line-height:1.4; }
  .swatches { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .sw { width:38px; height:38px; border-radius:50%; border:4px solid #fff; cursor:pointer; transition:transform .12s; }
  .sw.on { transform:scale(1.25); border-color:var(--sun); box-shadow:0 0 0 3px var(--ink); }
  button.big { font:inherit; font-weight:900; font-size:clamp(18px,3vw,30px); padding:12px 38px; border:0; border-radius:40px;
    background:var(--mint); color:var(--ink); cursor:pointer; box-shadow:0 7px 0 #1f9e6b; }
  button.big:active { transform:translateY(5px); box-shadow:0 2px 0 #1f9e6b; }
  #place { font-size:clamp(40px,10vw,110px); font-weight:900; color:var(--sun); text-shadow:0 5px 0 var(--pink); }
  #touch { position:absolute; left:0; right:0; bottom:10px; display:none; justify-content:space-between; padding:0 16px; pointer-events:none; }
  #touch div { display:flex; gap:12px; pointer-events:auto; }
  #touch button { width:72px; height:72px; border-radius:50%; border:4px solid #fff; background:rgba(255,95,162,.8); color:#fff; font-size:30px; font-weight:900; }
  @media (pointer:coarse) { #touch { display:flex; } }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>

  <div id="menu" class="overlay">
    <h1>BEAN RUSH</h1>
    <p>Corre contra 7 frijoles, salta los huecos y esquiva martillos y barras giratorias. ¡El primero en la meta gana la corona!</p>
    <p>Elige tu color:</p>
    <div class="swatches" id="swatches"></div>
    <button class="big" id="play">¡Jugar!</button>
    <p>← → o A D para correr · Espacio, W o ↑ para saltar</p>
  </div>

  <div id="result" class="overlay hidden">
    <div id="place"></div>
    <p id="msg"></p>
    <button class="big" id="again">Jugar otra vez</button>
  </div>

  <div id="touch">
    <div><button id="bL">◀</button><button id="bR">▶</button></div>
    <div><button id="bJ">▲</button></div>
  </div>
</div>

<script>
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = 960, H = 540, GY = 430, FIN = 7000, G = 1900, MAXV = 330;
const COLORS = ['#ff5fa2','#ffd23f','#3ddc97','#4cc9f0','#ff8a3d','#a66cff','#ff4d4d','#ffffff'];
let myColor = COLORS[0], state = 'menu', t = 0, countdown = 3, raceTime = 0, shake = 0;

// ---------- Pista ----------
const gaps = [[900,150],[1950,170],[3150,190],[4600,200],[5700,170],[6300,150]];
const boxes = [{x:1550,w:46,h:54},{x:2750,w:46,h:54},{x:3850,w:46,h:54},{x:5300,w:46,h:54}];
const hammers = [{x:1350,ph:0,sp:2.1},{x:2450,ph:1.5,sp:2.4},{x:3650,ph:3,sp:2.2},{x:5050,ph:0.7,sp:2.6},{x:6050,ph:2,sp:2.8}];
const spinners = [{x:2250,sp:2.3},{x:4100,sp:-2.6},{x:5450,sp:2.9}];
const HP = 120, HL = 270;

const solidAt = x => !gaps.some(g => x > g[0] && x < g[0] + g[1]);
const hammerHead = h => { const a = Math.sin(t*h.sp + h.ph)*1.15, w = Math.cos(t*h.sp + h.ph)*1.15*h.sp;
  return {x:h.x + Math.sin(a)*HL, y:HP + Math.cos(a)*HL, dir:Math.sign(w)||1}; };
const spinAngle = s => t*s.sp;
function segDist(px,py,ax,ay,bx,by){ const dx=bx-ax, dy=by-ay; let u=((px-ax)*dx+(py-ay)*dy)/(dx*dx+dy*dy); u=Math.max(0,Math.min(1,u));
  return Math.hypot(px-(ax+u*dx), py-(ay+u*dy)); }

// ---------- Frijoles ----------
const NAMES = ['Tú','Bola','Pipo','Nube','Gus','Lulú','Chispa','Moti'];
let beans = [];
function makeBean(i){
  const col = i===0 ? myColor : COLORS.filter(c=>c!==myColor)[(i-1)%7];
  return { i, name:NAMES[i], col, x:80, y:GY-46-i*0.1, w:34, h:46, vx:0, vy:0, ground:false, stun:0, hitCd:0,
    dir:0, wantJump:false, face:1, anim:0, fin:false, finT:0, lastSafe:80, respawn:0, bot:i>0,
    spd: 255 + Math.random()*70, smart: 0.45 + Math.random()*0.5, jitter: Math.random()*0.012 };
}
function reset(){
  beans = []; for (let i=0;i<8;i++){ const b = makeBean(i); b.x = 60; b.y = GY - 46; b.lane = i; beans.push(b); }
  beans.forEach((b,i)=>{ b.x = 40 + i*18; });
  countdown = 3.99; raceTime = 0; state = 'count';
}

function knock(b, dir, power, up){ if (b.hitCd>0) return; b.vx = dir*power; b.vy = -up; b.stun = 0.75; b.hitCd = 1.1; b.ground=false; if (b===beans[0]) shake = 0.3; }

function update(b, dt){
  b.hitCd -= dt; b.stun -= dt;
  if (b.respawn > 0){ b.respawn -= dt; if (b.respawn<=0){ b.x=b.lastSafe; b.y=100; b.vx=0; b.vy=0; b.stun=0.3; b.hitCd=1.5; } return; }
  const racing = state==='race' && !b.fin;
  let dir = 0, jump = false;
  if (b.bot) botThink(b); 
  if (racing && b.stun<=0){ dir = b.dir; jump = b.wantJump; }
  if (b.fin) dir = 0;
  const max = b.bot ? b.spd : MAXV;
  const acc = b.ground ? 9 : 3.2;
  if (b.stun<=0) b.vx += (dir*max - b.vx) * Math.min(1, acc*dt);
  else b.vx *= (1 - Math.min(1, 1.6*dt));

  if (jump && b.ground && b.stun<=0){ b.vy = -680; b.ground = false; }
  b.vy += G * dt;
  b.x += b.vx * dt;
  b.y += b.vy * dt;

  if (b.ground && solidAt(b.x)) b.lastSafe = Math.max(b.lastSafe, b.x);

  if (b.y >= GY - b.h){
    if (solidAt(b.x)){ b.y = GY - b.h; b.vy = 0; b.ground = true; }
    else { if (b.respawn <= 0) { b.respawn = 1.0; b.vy = 200; } }
  } else { b.ground = false; }

  if (b.x < 20){ b.x = 20; b.vx = 0; }
  if (b.x > FIN && !b.fin){ b.fin = true; b.finT = raceTime; }

  if (dir !== 0) b.face = dir;
  if (b.ground && Math.abs(b.vx)>20) b.anim += dt * Math.abs(b.vx) * 0.04; else b.anim = 0;
}

function botThink(b){
  b.dir = 1;
  const ahead = b.x + 120;
  const needsJump = gaps.some(g => ahead > g[0] && ahead < g[0] + g[1] + 30);
  const nearHammer = hammers.some(h => { const p = hammerHead(h); return Math.hypot(p.x - b.x, p.y - b.y) < 75; });
  b.wantJump = (needsJump || nearHammer) && b.ground;
}

// ---------- Controles ----------
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
});
window.addEventListener('keyup', e => { keys[e.code] = false; });

let touchL=false, touchR=false, touchJ=false;
document.getElementById('bL').onmousedown = () => touchL=true;
document.getElementById('bL').onmouseup = () => touchL=false;
document.getElementById('bR').onmousedown = () => touchR=true;
document.getElementById('bR').onmouseup = () => touchR=false;
document.getElementById('bJ').onmousedown = () => touchJ=true;
document.getElementById('bJ').onmouseup = () => touchJ=false;

// UI de colores
const swatchesDiv = document.getElementById('swatches');
COLORS.forEach((c, i) => {
  const d = document.createElement('div');
  d.className = 'sw' + (i===0?' on':'');
  d.style.background = c;
  d.onclick = () => {
    document.querySelectorAll('.sw').forEach(s => s.classList.remove('on'));
    d.classList.add('on');
    myColor = c;
  };
  swatchesDiv.appendChild(d);
});

document.getElementById('play').onclick = () => {
  document.getElementById('menu').classList.add('hidden');
  reset();
  state = 'count';
};
document.getElementById('again').onclick = () => {
  document.getElementById('result').classList.add('hidden');
  reset();
  state = 'count';
};

// ---------- Bucle Principal ----------
let lastT = performance.now();
function loop(now){
  const dt = Math.min(0.05, (now - lastT)/1000);
  lastT = now;
  t += dt;

  if (state === 'count'){
    countdown -= dt;
    if (countdown <= 0) state = 'race';
  } else if (state === 'race'){
    raceTime += dt;
  }

  if (state === 'race' || state === 'count'){
    const p = beans[0];
    let d = 0, j = false;
    if (keys['ArrowLeft'] || keys['KeyA'] || touchL) d = -1;
    if (keys['ArrowRight'] || keys['KeyD'] || touchR) d = 1;
    if (keys['Space'] || keys['ArrowUp'] || keys['KeyW'] || touchJ) j = true;
    p.dir = d; p.wantJump = j;

    beans.forEach(b => update(b, dt));

    // Colisiones con obstáculos
    beans.forEach(b => {
      hammers.forEach(h => {
        const hp = hammerHead(h);
        if (Math.hypot((b.x + b.w/2) - hp.x, (b.y + b.h/2) - hp.y) < 32) {
          knock(b, hp.dir, 380, 420);
        }
      });
      spinners.forEach(s => {
        const ang = spinAngle(s);
        const bx = s.x, by = GY - 60;
        const x2 = bx + Math.cos(ang)*110, y2 = by + Math.sin(ang)*110;
        const x1 = bx - Math.cos(ang)*110, y1 = by - Math.sin(ang)*110;
        if (segDist(b.x + b.w/2, b.y + b.h/2, x1, y1, x2, y2) < 28) {
          knock(b, Math.sign(b.x - bx) || 1, 440, 450);
        }
      });
    });

    if (beans.every(b => b.fin)){
      state = 'result';
      const rank = beans.slice().sort((a,b)=>a.finT - b.finT);
      const myPlace = rank.findIndex(b => b === beans[0]) + 1;
      const ords = ['1º','2º','3º','4º','5º','6º','7º','8º'];
      document.getElementById('place').innerText = ords[myPlace-1];
      document.getElementById('msg').innerText = myPlace === 1 ? '¡Ganaste la corona! 👑' : `¡Llegaste en el puesto ${myPlace}!`;
      document.getElementById('result').classList.remove('hidden');
    }
  }

  // ---------- Dibujado ----------
  ctx.clearRect(0,0,W,H);
  ctx.save();
  if (shake > 0) {
    shake -= dt;
    ctx.translate((Math.random()-0.5)*12, (Math.random()-0.5)*12);
  }

  // Cámara centrada en el jugador
  const camX = Math.max(0, Math.min(FIN - W + 200, beans[0].x - 300));
  ctx.translate(-camX, 0);

  // Fondo (Cielo y suelo)
  ctx.fillStyle = '#8fd3ff'; ctx.fillRect(camX, 0, W, H);
  
  // Suelo con huecos
  ctx.fillStyle = '#3ddc97';
  let curX = 0;
  gaps.forEach(g => {
    ctx.fillRect(curX, GY, g[0] - curX, H - GY);
    curX = g[0] + g[1];
  });
  ctx.fillRect(curX, GY, FIN + 800 - curX, H - GY);

  // Meta
  ctx.fillStyle = '#ffd23f';
  ctx.fillRect(FIN, GY - 220, 16, 220);
  ctx.fillStyle = '#ff5fa2';
  ctx.fillRect(FIN + 16, GY - 220, 16, 220);

  // Obstáculos (Martillos)
  hammers.forEach(h => {
    const hp = hammerHead(h);
    ctx.strokeStyle = '#2b1a5e'; ctx.lineWidth = 8;
    ctx.beginPath(); ctx.moveTo(h.x, HP); ctx.lineTo(hp.x, hp.y); ctx.stroke();
    ctx.fillStyle = '#ff4d4d';
    ctx.beginPath(); ctx.arc(hp.x, hp.y, 22, 0, Math.PI*2); ctx.fill();
    ctx.stroke();
  });

  // Obstáculos (Spinners)
  spinners.forEach(s => {
    const ang = spinAngle(s);
    ctx.save();
    ctx.translate(s.x, GY - 60);
    ctx.rotate(ang);
    ctx.fillStyle = '#ff8a3d';
    ctx.fillRect(-110, -14, 220, 28);
    ctx.strokeStyle = '#2b1a5e'; ctx.lineWidth = 4;
    ctx.strokeRect(-110, -14, 220, 28);
    ctx.restore();
  });

  // Dibujar Frijoles
  beans.forEach(b => {
    ctx.save();
    ctx.translate(b.x + b.w/2, b.y + b.h);
    if (b.respawn > 0) ctx.globalAlpha = 0.5;

    // Cuerpo del frijol
    ctx.fillStyle = b.col;
    ctx.strokeStyle = '#2b1a5e'; ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.roundRect(-b.w/2, -b.h + Math.sin(b.anim)*4, b.w, b.h, 16);
    ctx.fill(); ctx.stroke();

    // Ojos
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(b.face * 6, -b.h + 16, 6, 0, Math.PI*2);
    ctx.fill(); ctx.stroke();
    ctx.fillStyle = '#2b1a5e';
    ctx.beginPath();
    ctx.arc(b.face * 8, -b.h + 16, 2.5, 0, Math.PI*2);
    ctx.fill();

    // Nombre
    ctx.fillStyle = '#2b1a5e';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(b.name, 0, -b.h - 8);

    ctx.restore();
  });

  ctx.restore();

  // Cuenta regresiva en pantalla
  if (state === 'count'){
    ctx.fillStyle = 'rgba(43,26,94,0.6)';
    ctx.fillRect(0,0,W,H);
    ctx.fillStyle = '#ffd23f';
    ctx.font = '900 90px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(Math.ceil(countdown), W/2, H/2 + 20);
  }

  requestAnimationFrame(loop);
}

requestAnimationFrame(loop);
</script>
</body>
</html>
